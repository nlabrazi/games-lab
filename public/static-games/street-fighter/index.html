<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" href="./public/images/vsLogo.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Street Fighter by nabst3r</title>
  <link rel="stylesheet" href="src/style.css" />
  <script type="module" src="src/index.js"></script>
</head>

<body>
  <main>
    <canvas width="382" height="224"></canvas>
    <div class="mobile-fight-controls" aria-label="Contrôles tactiles Street Fighter">
      <div class="mobile-dpad">
        <button class="mobile-fight-button" data-mobile-control="up" aria-label="Sauter">▲</button>
        <button class="mobile-fight-button" data-mobile-control="left" aria-label="Reculer">◀</button>
        <button class="mobile-fight-button" data-mobile-control="right" aria-label="Avancer">▶</button>
        <button class="mobile-fight-button" data-mobile-control="down" aria-label="S'accroupir">▼</button>
      </div>
      <div class="mobile-attacks" aria-label="Attaques">
        <button class="mobile-fight-button attack" data-mobile-control="lightPunch" aria-label="Poing léger">LP</button>
        <button class="mobile-fight-button attack" data-mobile-control="mediumPunch" aria-label="Poing moyen">MP</button>
        <button class="mobile-fight-button attack" data-mobile-control="heavyPunch" aria-label="Poing fort">HP</button>
        <button class="mobile-fight-button attack kick" data-mobile-control="lightKick" aria-label="Pied léger">LK</button>
        <button class="mobile-fight-button attack kick" data-mobile-control="mediumKick" aria-label="Pied moyen">MK</button>
        <button class="mobile-fight-button attack kick" data-mobile-control="heavyKick" aria-label="Pied fort">HK</button>
      </div>
    </div>
  </main>
  <audio id="kensTheme" src="./public/sounds/kens-theme.ogg" preload="auto" loop></audio>
  <audio id="sound-fighter-land" src="./public/sounds/land.ogg" preload="auto"></audio>
  <audio id="sound-fighter-light-kick-hit" src="./public/sounds/light-kick-hit.ogg" preload="auto"></audio>
  <audio id="sound-fighter-medium-kick-hit" src="./public/sounds/medium-kick-hit.ogg" preload="auto"></audio>
  <audio id="sound-fighter-heavy-kick-hit" src="./public/sounds/heavy-kick-hit.ogg" preload="auto"></audio>
  <audio id="sound-fighter-light-attack" src="./public/sounds/light-attack.ogg" preload="auto"></audio>
  <audio id="sound-fighter-medium-attack" src="./public/sounds/medium-attack.ogg" preload="auto"></audio>
  <audio id="sound-fighter-heavy-attack" src="./public/sounds/heavy-attack.ogg" preload="auto"></audio>
  <audio id="sound-fighter-light-punch-hit" src="./public/sounds/light-punch-hit.ogg" preload="auto"></audio>
  <audio id="sound-fighter-medium-punch-hit" src="./public/sounds/medium-punch-hit.ogg" preload="auto"></audio>
  <audio id="sound-fighter-heavy-punch-hit" src="./public/sounds/heavy-punch-hit.ogg" preload="auto"></audio>
  <audio id="sound-ken-hadouken" src="./public/sounds/hadouken.ogg" preload="auto"></audio>
  <audio id="sound-ryu-hadouken" src="./public/sounds/hadouken.ogg" preload="auto"></audio>

  <img id="KenStage" src="public/images/kenstage.png" alt="kenstage" />
  <img id="hud" src="public/images/hud.png" alt="HUD" />
  <img id="KenImage" src="./public/images/Ken.png" />
  <img id="RyuImage" src="public/images/Ryu.png" />
  <img id="ShadowImage" src="./public/images/shadow.png" />
  <img id="Decals" src="./public/images/decals.png" />
  <img id="Controls" src="./public/images/Controls.png" />
  <img id="Logo" src="./public/images/logo.png" />
  <img id="Winner" src="./public/images/winnerText.png" />
</body>

</html>
